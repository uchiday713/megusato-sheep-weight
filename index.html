<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>めぐさと羊 体重記録</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 35px 20px;
      background: #f5f5ef;
      color: #333;
    }

    h1 {
      font-size: 26px;
    }

    button {
      width: 90%;
      max-width: 400px;
      padding: 22px;
      margin: 25px 0;
      font-size: 24px;
      border: none;
      border-radius: 14px;
      background: #49764b;
      color: white;
    }

    #status {
      font-size: 20px;
      margin: 20px;
    }

    #heard {
      font-size: 18px;
      margin: 20px 0;
      color: #666;
    }

    #parsed {
      max-width: 400px;
      margin: 25px auto;
      padding: 20px;
      background: white;
      border-radius: 14px;
      font-size: 24px;
      line-height: 1.8;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>

<h1>🐑 めぐさと羊 体重記録</h1>

<button id="startButton">
  🎤 音声入力
</button>

<div id="status">
  ボタンを押してください
</div>

<div id="heard"></div>

<div id="parsed"></div>


<script>

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

const status =
  document.getElementById("status");

const heard =
  document.getElementById("heard");

const parsed =
  document.getElementById("parsed");

const button =
  document.getElementById("startButton");


if (!SpeechRecognition) {

  status.textContent =
    "このブラウザでは音声認識を利用できません";

  button.disabled = true;

} else {

  const recognition =
    new SpeechRecognition();

  recognition.lang = "ja-JP";
  recognition.continuous = false;
  recognition.interimResults = false;


  button.addEventListener("click", function() {

    heard.textContent = "";
    parsed.textContent = "";

    status.textContent =
      "音声認識を開始しています…";

    recognition.start();

  });


  recognition.onstart = function() {

    status.textContent =
      "🎤 聞いています…";

  };


  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    heard.textContent =
      "認識：" + text;

    parseWeight(text);

  };


  recognition.onerror = function(event) {

    status.textContent =
      "エラー：" + event.error;

  };

}


// 認識された文章を
// 「羊の名前」と「体重」に分ける
function parseWeight(text) {

  let normalized = text
    .replace(/０/g, "0")
    .replace(/１/g, "1")
    .replace(/２/g, "2")
    .replace(/３/g, "3")
    .replace(/４/g, "4")
    .replace(/５/g, "5")
    .replace(/６/g, "6")
    .replace(/７/g, "7")
    .replace(/８/g, "8")
    .replace(/９/g, "9")
    .replace(/．/g, ".")
    .replace(/点/g, ".");


  const match =
    normalized.match(
      /^(.+?)[、,\s]*(\d+(?:\.\d+)?)\s*(?:キロ|kg|キログラム)/i
    );


  if (!match) {

    status.textContent =
      "うまく読み取れませんでした";

    parsed.innerHTML =
      '<span class="error">' +
      '「名前、47.5キロ」のように話してください' +
      '</span>';

    return;
  }


  const name =
    match[1].trim();

  const weight =
    Number(match[2]);


  status.textContent =
    "読み取れました！";


  parsed.innerHTML =
    "🐑 名前：<strong>" +
    escapeHtml(name) +
    "</strong><br>" +

    "⚖️ 体重：<strong>" +
    weight +
    " kg</strong>";

}


// HTML表示用の安全処理
function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
