<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>めぐさと羊 体重記録</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 35px 20px;
      background: #f5f5ef;
      color: #333;
    }

    h1 {
      font-size: 26px;
    }

    button {
      width: 90%;
      max-width: 400px;
      padding: 22px;
      margin: 25px 0;
      font-size: 24px;
      border: none;
      border-radius: 14px;
      background: #49764b;
      color: white;
    }

    #status {
      font-size: 21px;
      margin: 20px;
      font-weight: bold;
    }

    #heard {
      font-size: 18px;
      color: #666;
      margin: 20px 0;
    }

    #parsed {
      max-width: 400px;
      margin: 25px auto;
      padding: 20px;
      background: white;
      border-radius: 14px;
      font-size: 23px;
      line-height: 1.8;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>

<h1>🐑 めぐさと羊 体重記録</h1>

<button id="startButton">
  🎤 音声入力
</button>

<button id="soundTestButton">
  🔊 音声テスト
</button>
  
<div id="status">
  ボタンを押してください
</div>

<div id="heard"></div>
<div id="parsed"></div>


<script>

// ★ここだけ自分のURLに変更
const API_URL =
  "https://script.google.com/macros/s/AKfycbzSuD_O2Pny7pmCAMq2ENK_v_KYv4Wn42sOsqLQNhI6TMoWEkVBggiJW9JBBIiw6AWc/exec";


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

const status =
  document.getElementById("status");

const heard =
  document.getElementById("heard");

const parsed =
  document.getElementById("parsed");

const button =
  document.getElementById("startButton");

const soundTestButton =
  document.getElementById("soundTestButton");

soundTestButton.addEventListener("click", function() {

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(
      "音声テストです"
    );

  utterance.lang = "ja-JP";
  utterance.volume = 1;
  utterance.rate = 1;

  speechSynthesis.speak(utterance);

});


let recognition;


if (!SpeechRecognition) {

  status.textContent =
    "このブラウザでは音声認識を利用できません";

  button.disabled = true;

} else {

  recognition =
    new SpeechRecognition();

  recognition.lang = "ja-JP";
  recognition.continuous = false;
  recognition.interimResults = false;


  button.addEventListener("click", function() {

    heard.textContent = "";
    parsed.textContent = "";

    status.textContent =
      "音声認識を開始しています…";

    recognition.start();

  });


  recognition.onstart = function() {

    status.textContent =
      "🎤 聞いています…";

  };


  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    heard.textContent =
      "認識：" + text;

    parseWeight(text);

  };


  recognition.onerror = function(event) {

    status.textContent =
      "エラー：" + event.error;

  };
}


// 音声を名前＋体重に分ける
function parseWeight(text) {

  let normalized = text
    .replace(/０/g, "0")
    .replace(/１/g, "1")
    .replace(/２/g, "2")
    .replace(/３/g, "3")
    .replace(/４/g, "4")
    .replace(/５/g, "5")
    .replace(/６/g, "6")
    .replace(/７/g, "7")
    .replace(/８/g, "8")
    .replace(/９/g, "9")
    .replace(/．/g, ".")
    .replace(/点/g, ".");


  const match =
    normalized.match(
      /^(.+?)[、,\s]*(\d+(?:\.\d+)?)\s*(?:キロ|kg|キログラム)/i
    );


  if (!match) {

    status.textContent =
      "うまく読み取れませんでした";

    parsed.innerHTML =
      '<span class="error">' +
      '「名前、47.5キロ」のように話してください' +
      '</span>';

    return;
  }


  const name =
    match[1].trim();

  const weight =
    Number(match[2]);


  parsed.innerHTML =
    "🐑 名前：<strong>" +
    escapeHtml(name) +
    "</strong><br>" +
    "⚖️ 体重：<strong>" +
    weight +
    " kg</strong>";


  // Google Sheetへ送信
  registerWeight(name, weight);
}


// Apps Scriptへ送る
function registerWeight(name, weight) {

  status.textContent =
    "Google Sheetへ登録しています…";


  const callbackName =
    "sheepCallback_" + Date.now();


  window[callbackName] =
    function(result) {

      if (result.success) {

        status.textContent =
          "✅ 登録しました";

        speakResult(result);

      } else {

        status.textContent =
          "登録エラー：" + result.error;

      }


      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?action=register" +
    "&name=" +
    encodeURIComponent(name) +
    "&weight=" +
    encodeURIComponent(weight) +
    "&callback=" +
    encodeURIComponent(callbackName);


  script.onerror =
    function() {

      status.textContent =
        "通信エラーが発生しました";

      delete window[callbackName];

    };


  document.body.appendChild(script);
}


// 登録結果を読み上げる
function speakResult(result) {

  let message =
    result.name +
    "、" +
    result.weight +
    "キロ、登録しました。";


  if (
    result.previousWeight !== null &&
    result.previousWeight !== undefined
  ) {

    const diff =
      result.difference;


    if (diff > 0) {

      message +=
        "前回より" +
        diff +
        "キロ増えています。";

    } else if (diff < 0) {

      message +=
        "前回より" +
        Math.abs(diff) +
        "キロ減っています。";

    } else {

      message +=
        "前回と同じです。";

    }
  }


  // 残っている読み上げを一度リセット
  speechSynthesis.cancel();


  // 少し待ってから読み上げる
  setTimeout(function() {

    const utterance =
      new SpeechSynthesisUtterance(message);

    utterance.lang = "ja-JP";
    utterance.volume = 1;
    utterance.rate = 1;

    speechSynthesis.speak(utterance);

  }, 300);

}

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}

</script>

</body>
</html>
