<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>めぐさと羊 体重記録</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding: 30px 20px;
  background: #f5f5ef;
  color: #333;
}

h1 { font-size: 26px; }

button {
  width: 90%;
  max-width: 400px;
  padding: 20px;
  margin: 10px;
  font-size: 22px;
  border: none;
  border-radius: 14px;
  color: white;
}

#startButton { background: #49764b; }
#stopButton { background: #8b4545; }

#status {
  font-size: 22px;
  font-weight: bold;
  margin: 25px 0;
}

#heard {
  font-size: 17px;
  color: #666;
  margin: 15px;
}

#parsed {
  max-width: 400px;
  margin: 20px auto;
  padding: 20px;
  background: white;
  border-radius: 14px;
  font-size: 22px;
  line-height: 1.7;
}
</style>
</head>

<body>

<h1>🐑 めぐさと羊 体重記録</h1>

<button id="startButton">
▶️ 連続測定を開始
</button>

<button id="stopButton">
⏹ 測定を終了
</button>

<div id="status">
測定を開始してください
</div>

<div id="heard"></div>
<div id="parsed"></div>

<script>

// ★ここを自分のApps Script URLに変更
const API_URL =
  "https://script.google.com/macros/s/AKfycbzSuD_O2Pny7pmCAMq2ENK_v_KYv4Wn42sOsqLQNhI6TMoWEkVBggiJW9JBBIiw6AWc/exec";

const WAKE_WORD = "羊体重";

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

const status =
  document.getElementById("status");

const heard =
  document.getElementById("heard");

const parsed =
  document.getElementById("parsed");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

let recognition;
let running = false;
let restarting = false;


if (!SpeechRecognition) {

  status.textContent =
    "このブラウザでは音声認識を利用できません";

  startButton.disabled = true;

} else {

  recognition =
    new SpeechRecognition();

  recognition.lang = "ja-JP";
  recognition.continuous = false;
  recognition.interimResults = false;


  // 認識結果
  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript.trim();

    heard.textContent =
      "認識：" + text;

    processSpeech(text);
  };


  recognition.onerror = function(event) {

    console.log(
      "Speech error:",
      event.error
    );

    if (
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ) {

      running = false;

      status.textContent =
        "マイクを利用できません";

      return;
    }

    if (running) {
      restartListening(700);
    }
  };


  recognition.onend = function() {

    // processSpeech側で登録処理中の場合は
    // そこで再開するので何もしない
  };
}


// 連続測定開始
startButton.addEventListener(
  "click",
  function() {

    if (running) return;

    running = true;

    heard.textContent = "";
    parsed.textContent = "";

    status.textContent =
      "開始します…";

    // iPhone Safariの音声を有効化
    speechSynthesis.cancel();

    const unlock =
      new SpeechSynthesisUtterance(
        "開始します"
      );

    unlock.lang = "ja-JP";
    unlock.rate = 0.9;

    unlock.onend = function() {

      if (running) {
        startListening();
      }
    };

    speechSynthesis.speak(unlock);
  }
);


// 測定終了
stopButton.addEventListener(
  "click",
  function() {

    running = false;

    speechSynthesis.cancel();

    try {
      recognition.abort();
    } catch (e) {}

    status.textContent =
      "測定を終了しました";

    heard.textContent = "";
  }
);


// 聞き取り開始
function startListening() {

  if (!running) return;

  status.textContent =
    "🎤 「羊体重」と呼びかけてください";

  try {

    recognition.start();

  } catch (e) {

    restartListening(700);

  }
}


// 少し待って再開
function restartListening(delay) {

  if (!running || restarting) return;

  restarting = true;

  setTimeout(function() {

    restarting = false;

    if (running) {
      startListening();
    }

  }, delay);
}


// 認識内容を処理
function processSpeech(text) {

  if (!running) return;


  let normalized =
    normalizeText(text);


  // 「めぐさと」で始まらなければ無視
  if (!normalized.startsWith(WAKE_WORD)) {

    status.textContent =
      "待機中…";

    restartListening(500);

    return;
  }


  // 最初の「めぐさと」を削除
  normalized =
    normalized
      .slice(WAKE_WORD.length)
      .replace(/^[、,\s]+/, "");


  // 名前＋体重を取得
  const match =
    normalized.match(
      /^(.+?)[、,\s]*(\d+(?:\.\d+)?)\s*(?:キロ|kg|キログラム)/i
    );


  if (!match) {

    status.textContent =
      "名前と体重を読み取れませんでした";

    restartListening(700);

    return;
  }


  const name =
    match[1].trim();

  const weight =
    Number(match[2]);


  parsed.innerHTML =
    "🐑 名前：<strong>" +
    escapeHtml(name) +
    "</strong><br>" +
    "⚖️ 体重：<strong>" +
    weight +
    " kg</strong>";


  registerWeight(name, weight);
}


// 数字などを整える
function normalizeText(text) {

  return text
    .replace(/０/g, "0")
    .replace(/１/g, "1")
    .replace(/２/g, "2")
    .replace(/３/g, "3")
    .replace(/４/g, "4")
    .replace(/５/g, "5")
    .replace(/６/g, "6")
    .replace(/７/g, "7")
    .replace(/８/g, "8")
    .replace(/９/g, "9")
    .replace(/．/g, ".")
    .replace(/点/g, ".")
    .trim();
}


// Google Sheetへ登録
function registerWeight(name, weight) {

  status.textContent =
    "登録しています…";


  const callbackName =
    "sheepCallback_" + Date.now();


  window[callbackName] =
    function(result) {

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }


      if (!result.success) {

        status.textContent =
          "登録エラー：" + result.error;

        restartListening(1000);

        return;
      }


      status.textContent =
        "✅ 登録しました";

      speakResult(result);
    };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?action=register" +
    "&name=" +
    encodeURIComponent(name) +
    "&weight=" +
    encodeURIComponent(weight) +
    "&callback=" +
    encodeURIComponent(callbackName);


  script.onerror =
    function() {

      status.textContent =
        "通信エラーが発生しました";

      delete window[callbackName];

      restartListening(1000);
    };


  document.body.appendChild(script);
}


// 登録結果を復唱
function speakResult(result) {

  let message =
    result.name +
    "、" +
    result.weight +
    "キロ、登録しました。";


  if (
    result.previousWeight !== null &&
    result.previousWeight !== undefined
  ) {

    const diff =
      result.difference;


    if (diff > 0) {

      message +=
        "前回より" +
        diff +
        "キロ増えています。";

    } else if (diff < 0) {

      message +=
        "前回より" +
        Math.abs(diff) +
        "キロ減っています。";

    } else {

      message +=
        "前回と同じです。";
    }
  }


  speechSynthesis.cancel();


  setTimeout(function() {

    const utterance =
      new SpeechSynthesisUtterance(
        message
      );

    utterance.lang = "ja-JP";
    utterance.rate = 1;


    // 復唱が終わったら次の羊へ
    utterance.onend = function() {

      if (running) {

        status.textContent =
          "次の羊を待っています…";

        restartListening(500);
      }
    };


    speechSynthesis.speak(
      utterance
    );

  }, 300);
}


function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

</script>

</body>
</html>
