<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>めぐさと羊 体重記録</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding: 25px 15px;
  background: #f5f5ef;
  color: #333;
}

h1 { font-size: 26px; }

button {
  width: 90%;
  max-width: 400px;
  padding: 18px;
  margin: 8px;
  font-size: 20px;
  border: none;
  border-radius: 14px;
  color: white;
}

#startButton { background: #49764b; }
#stopButton { background: #8b4545; }
#graphButton { background: #416b91; margin-top: 25px; }
#closeGraphButton { background: #777; }

#status {
  font-size: 21px;
  font-weight: bold;
  margin: 20px 0;
}

#heard {
  font-size: 16px;
  color: #666;
  margin: 15px;
}

#parsed {
  max-width: 400px;
  margin: 20px auto;
  padding: 18px;
  background: white;
  border-radius: 14px;
  font-size: 21px;
  line-height: 1.7;
}

#graphArea {
  display: none;
  max-width: 700px;
  margin: 25px auto;
  padding: 20px;
  background: white;
  border-radius: 14px;
}

select {
  width: 90%;
  max-width: 350px;
  padding: 14px;
  margin: 10px;
  font-size: 20px;
  border-radius: 10px;
}

#graphInfo {
  font-size: 18px;
  margin: 15px;
  font-weight: bold;
}

.chartBox {
  position: relative;
  width: 100%;
  height: 340px;
}
</style>
</head>

<body>

<h1>🐑 めぐさと羊 体重記録</h1>

<button id="startButton">
▶️ 連続測定を開始
</button>

<button id="stopButton">
⏹ 測定を終了
</button>

<div id="status">
測定を開始してください
</div>

<div id="heard"></div>
<div id="parsed"></div>

<button id="graphButton">
📈 体重推移を見る
</button>


<div id="graphArea">

  <h2>📈 体重推移</h2>

  <select id="sheepSelect">
    <option value="">
      羊を選んでください
    </option>
  </select>

  <div id="graphInfo"></div>

  <div class="chartBox">
    <canvas id="weightChart"></canvas>
  </div>

  <button id="closeGraphButton">
    閉じる
  </button>

</div>


<script>

// ★ここだけ自分のApps Script URLに変更
const API_URL =
  "https://script.google.com/macros/s/AKfycbzSuD_O2Pny7pmCAMq2ENK_v_KYv4Wn42sOsqLQNhI6TMoWEkVBggiJW9JBBIiw6AWc/exec";

const WAKE_WORD = "羊体重";


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


const status =
  document.getElementById("status");

const heard =
  document.getElementById("heard");

const parsed =
  document.getElementById("parsed");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const graphButton =
  document.getElementById("graphButton");

const graphArea =
  document.getElementById("graphArea");

const sheepSelect =
  document.getElementById("sheepSelect");

const closeGraphButton =
  document.getElementById("closeGraphButton");

const graphInfo =
  document.getElementById("graphInfo");


let recognition;
let running = false;
let restarting = false;

let weightChart = null;


// ★全羊データをここに保存
let allHistoryData = null;



// ======================================
// 音声認識
// ======================================

if (!SpeechRecognition) {

  status.textContent =
    "このブラウザでは音声認識を利用できません";

  startButton.disabled = true;

} else {

  recognition =
    new SpeechRecognition();

  recognition.lang = "ja-JP";
  recognition.continuous = false;
  recognition.interimResults = false;


  recognition.onresult =
    function(event) {

      const text =
        event.results[0][0]
          .transcript
          .trim();

      heard.textContent =
        "認識：" + text;

      processSpeech(text);
    };


  recognition.onerror =
    function(event) {

      if (
        event.error === "not-allowed" ||
        event.error === "service-not-allowed"
      ) {

        running = false;

        status.textContent =
          "マイクを利用できません";

        return;
      }


      if (running) {
        restartListening(700);
      }
    };
}



// ======================================
// 測定開始
// ======================================

startButton.addEventListener(
  "click",
  function() {

    if (running) return;


    graphArea.style.display =
      "none";


    running = true;

    heard.textContent = "";
    parsed.textContent = "";

    status.textContent =
      "開始します…";


    speechSynthesis.cancel();


    const unlock =
      new SpeechSynthesisUtterance(
        "開始します"
      );


    unlock.lang = "ja-JP";

    // 前に調整した速度
    unlock.rate = 0.9;


    unlock.onend =
      function() {

        if (running) {
          startListening();
        }
      };


    speechSynthesis.speak(
      unlock
    );
  }
);



// ======================================
// 測定終了
// ======================================

stopButton.addEventListener(
  "click",
  stopMeasurement
);


function stopMeasurement() {

  running = false;

  speechSynthesis.cancel();


  if (recognition) {

    try {
      recognition.abort();
    } catch (e) {}
  }


  status.textContent =
    "測定を終了しました";
}



// ======================================
// 音声待受
// ======================================

function startListening() {

  if (!running) return;


  status.textContent =
    "🎤 「羊体重」と呼びかけてください";


  try {

    recognition.start();

  } catch (e) {

    restartListening(700);
  }
}



function restartListening(delay) {

  if (
    !running ||
    restarting
  ) {
    return;
  }


  restarting = true;


  setTimeout(
    function() {

      restarting = false;


      if (running) {
        startListening();
      }

    },
    delay
  );
}



// ======================================
// 音声解析
// ======================================

function processSpeech(text) {

  if (!running) return;


  let normalized =
    normalizeText(text);


  // 羊体重から始まらなければ無視
  if (
    !normalized.startsWith(
      WAKE_WORD
    )
  ) {

    status.textContent =
      "待機中…";

    restartListening(500);

    return;
  }


  normalized =
    normalized
      .slice(WAKE_WORD.length)
      .replace(
        /^[、,\s]+/,
        ""
      );


  const match =
    normalized.match(
      /^(.+?)[、,\s]*(\d+(?:\.\d+)?)\s*(?:キロ|kg|キログラム)/i
    );


  if (!match) {

    status.textContent =
      "名前と体重を読み取れませんでした";

    restartListening(700);

    return;
  }


  const name =
    match[1].trim();

  const weight =
    Number(match[2]);


  parsed.innerHTML =
    "🐑 名前：<strong>" +
    escapeHtml(name) +
    "</strong><br>" +
    "⚖️ 体重：<strong>" +
    weight +
    " kg</strong>";


  registerWeight(
    name,
    weight
  );
}



// ======================================
// 数字変換
// ======================================

function normalizeText(text) {

  return text
    .replace(/０/g, "0")
    .replace(/１/g, "1")
    .replace(/２/g, "2")
    .replace(/３/g, "3")
    .replace(/４/g, "4")
    .replace(/５/g, "5")
    .replace(/６/g, "6")
    .replace(/７/g, "7")
    .replace(/８/g, "8")
    .replace(/９/g, "9")
    .replace(/．/g, ".")
    .replace(/点/g, ".")
    .trim();
}



// ======================================
// 体重登録
// ======================================

function registerWeight(
  name,
  weight
) {

  status.textContent =
    "登録しています…";


  jsonpRequest(
    {
      action: "register",
      name: name,
      weight: weight
    },

    function(result) {

      if (!result.success) {

        status.textContent =
          "登録エラー：" +
          result.error;

        restartListening(1000);

        return;
      }


      // ★新しい測定が入ったので
      // グラフデータを次回再取得
      allHistoryData = null;


      status.textContent =
        "✅ 登録しました";

      speakResult(result);
    }
  );
}



// ======================================
// 登録結果読み上げ
// ======================================

function speakResult(result) {

  let message =
    result.name +
    "、" +
    result.weight +
    "キロ、登録しました。";


  if (
    result.previousWeight !== null &&
    result.previousWeight !== undefined
  ) {

    const diff =
      result.difference;


    if (diff > 0) {

      message +=
        "前回より" +
        diff +
        "キロ増えています。";

    } else if (diff < 0) {

      message +=
        "前回より" +
        Math.abs(diff) +
        "キロ減っています。";

    } else {

      message +=
        "前回と同じです。";
    }
  }


  speechSynthesis.cancel();


  setTimeout(
    function() {

      const utterance =
        new SpeechSynthesisUtterance(
          message
        );


      utterance.lang =
        "ja-JP";

      utterance.rate =
        1;


      utterance.onend =
        function() {

          if (running) {

            status.textContent =
              "次の羊を待っています…";

            restartListening(500);
          }
        };


      speechSynthesis.speak(
        utterance
      );

    },
    300
  );
}



// ======================================
// グラフを開く
// ======================================

graphButton.addEventListener(
  "click",
  function() {

    stopMeasurement();


    graphArea.style.display =
      "block";


    // すでに取得済みなら通信しない
    if (allHistoryData) {

      setupSheepSelect();

      return;
    }


    graphInfo.textContent =
      "体重データを読み込んでいます…";


    loadAllHistory();
  }
);



// ======================================
// ★全羊データを1回だけ取得
// ======================================

function loadAllHistory() {

  jsonpRequest(
    {
      action: "allHistory"
    },

    function(result) {

      if (!result.success) {

        graphInfo.textContent =
          "データ取得エラー：" +
          result.error;

        return;
      }


      // iPhone内に保持
      allHistoryData =
        result.sheep;


      setupSheepSelect();
    }
  );
}



// ======================================
// 羊選択メニュー
// ======================================

function setupSheepSelect() {

  const names =
    Object.keys(
      allHistoryData || {}
    ).sort();


  sheepSelect.innerHTML =
    '<option value="">' +
    '羊を選んでください' +
    '</option>';


  names.forEach(
    function(name) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        name;

      option.textContent =
        name;


      sheepSelect.appendChild(
        option
      );
    }
  );


  graphInfo.textContent =
    "羊を選んでください";
}



// ======================================
// ★選ぶだけで即グラフ表示
// ======================================

sheepSelect.addEventListener(
  "change",
  function() {

    const name =
      sheepSelect.value;


    if (!name) {

      graphInfo.textContent =
        "羊を選んでください";

      return;
    }


    drawWeightChart(
      name,
      allHistoryData[name]
    );
  }
);



// ======================================
// グラフ描画
// ======================================

function drawWeightChart(
  name,
  history
) {

  if (
    !history ||
    history.length === 0
  ) {

    graphInfo.textContent =
      "体重データがありません";

    return;
  }


  const labels =
    history.map(
      function(item) {
        return item.date;
      }
    );


  const weights =
    history.map(
      function(item) {
        return item.weight;
      }
    );


  const latest =
    weights[
      weights.length - 1
    ];


  let info =
    "🐑 " +
    name +
    "　現在：" +
    latest +
    " kg";


  if (
    weights.length >= 2
  ) {

    const previous =
      weights[
        weights.length - 2
      ];


    const diff =
      Math.round(
        (
          latest -
          previous
        ) * 10
      ) / 10;


    if (diff > 0) {

      info +=
        "　前回比：+" +
        diff +
        " kg";

    } else {

      info +=
        "　前回比：" +
        diff +
        " kg";
    }
  }


  graphInfo.textContent =
    info;


  if (weightChart) {
    weightChart.destroy();
  }


  const ctx =
    document
      .getElementById(
        "weightChart"
      )
      .getContext("2d");


  weightChart =
    new Chart(
      ctx,
      {

        type: "line",

        data: {

          labels: labels,

          datasets: [

            {

              label:
                name +
                " の体重",

              data:
                weights,

              borderColor:
                "#49764b",

              backgroundColor:
                "#49764b",

              borderWidth:
                3,

              pointRadius:
                5,

              pointHoverRadius:
                7,

              tension:
                0.2
            }
          ]
        },


        options: {

          responsive:
            true,

          maintainAspectRatio:
            false,


          plugins: {

            legend: {
              display: true
            }
          },


          scales: {

            y: {

              title: {

                display:
                  true,

                text:
                  "体重（kg）"
              }
            },


            x: {

              title: {

                display:
                  true,

                text:
                  "測定日"
              }
            }
          }
        }
      }
    );
}



// ======================================
// グラフを閉じる
// ======================================

closeGraphButton.addEventListener(
  "click",
  function() {

    graphArea.style.display =
      "none";


    status.textContent =
      "測定を開始してください";
  }
);



// ======================================
// JSONP通信
// ======================================

function jsonpRequest(
  params,
  callback
) {

  const callbackName =
    "sheepCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 10000
    );


  const script =
    document.createElement(
      "script"
    );


  window[callbackName] =
    function(result) {

      try {

        callback(result);

      } finally {

        delete window[
          callbackName
        ];


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );
        }
      }
    };


  const query =
    Object.keys(params)
      .map(
        function(key) {

          return (
            encodeURIComponent(key) +
            "=" +
            encodeURIComponent(
              params[key]
            )
          );
        }
      )
      .join("&");


  script.src =
    API_URL +
    "?" +
    query +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function() {

      delete window[
        callbackName
      ];


      graphInfo.textContent =
        "通信エラーが発生しました";
    };


  document.body.appendChild(
    script
  );
}



// ======================================
// HTML安全表示
// ======================================

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;
}

// ======================================
// ★ページ起動時にグラフデータを先読み
// ======================================

function preloadAllHistory() {

  if (allHistoryData) {
    return;
  }

  jsonpRequest(
    {
      action: "allHistory"
    },

    function(result) {

      if (result.success) {

        allHistoryData =
          result.sheep;

        console.log(
          "体重履歴を先読みしました"
        );
      }
    }
  );
}


// ページを開いて0.5秒後に
// 裏で読み込み開始
setTimeout(
  function() {

    preloadAllHistory();

  },
  500
);
  
</script>

</body>
</html>
